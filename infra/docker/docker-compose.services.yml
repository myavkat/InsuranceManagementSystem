# ============================================================
# docker-compose.services.yml — Run all 6 microservices as containers
#
# Prerequisites:
#   ./gradlew bootJar -x test
#
# Full startup (infra + services):
#   ./gradlew bootJar -x test && docker compose \
#     -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.services.yml \
#     up -d --build
#
# Services only (infra already up):
#   docker compose -f docker-compose.services.yml up -d --build
# ============================================================

services:
  customer-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: services/customer-service/build/libs/customer-service-0.0.1-SNAPSHOT.jar
    container_name: customer-service
    ports: ["8081:8080"]
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      SPRING_DATASOURCE_URL: jdbc:postgresql://customer-db:5432/customer_db
    networks: [insurance-net]
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      customer-db: { condition: service_healthy }

  vehicle-service:

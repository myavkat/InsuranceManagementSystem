server:
  port: 8081

spring:
  application:
    name: customer-service
  profiles:
    active: dev
  config:
    import: classpath:application-common.yml
  datasource:
    url: jdbc:postgresql://localhost:5433/customer_db
    username: ims_user
    password: ims_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    stream:
      default-binder: kafka
      dynamicDestinations: estimation.saga,customer.events
      bindings:
        processCustomerSaga-in-0:
          destination: estimation.saga
          group: customer-service-group
      kafka:
        default:
          consumer:
            # Error handling architecture:
            # - SAGA consumers (functional bindings): retry via binder-level retry config,
            #   then route to dlq.saga via enableDlq per binding
            # - DlqMonitor (@KafkaListener): uses dlqMonitorContainerFactory with
            #   no-retry handler to prevent infinite DLQ loops
            # - The KafkaErrorHandlerConfig CommonErrorHandler bean serves ONLY
            #   @KafkaListener containers (currently just DlqMonitor)
            retry:
              maxAttempts: 5
              backOff:
                initialInterval: 1000
                multiplier: 2.0
                maxInterval: 8000
        bindings:
          processCustomerSaga-in-0:
            consumer:
              enableDlq: true
              dlqName: dlq.saga
              dlqProducerProperties:
                configuration:
                  key.serializer: org.apache.kafka.common.serialization.StringSerializer
                  value.serializer: org.springframework.kafka.support.serializer.JsonSerializer
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          defaultBrokerPort: 9092
          configuration:
            auto.create.topics.enable: false  # topics are pre-provisioned by kafka-init
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: customer-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.insurancemanagementsystem.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

customer:
  outbox:
    poll-interval-ms: 1000
    max-retries: 3
    failed-ttl-minutes: 60

outbox:
  poll-interval-ms: ${customer.outbox.poll-interval-ms:1000}
  max-retries: ${customer.outbox.max-retries:3}
  failed-ttl-minutes: ${customer.outbox.failed-ttl-minutes:60}

logging:
  level:
    com.insurancemanagementsystem: DEBUG

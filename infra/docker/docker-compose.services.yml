# ============================================================
# docker-compose.services.yml — Run all 6 microservices as containers
#
# Prerequisites:
#   ./gradlew bootJar -x test
#
# Full startup (infra + services):
#   ./gradlew bootJar -x test && docker compose \
#     -f docker-compose.yml -f docker-compose.override.yml -f docker-compose.services.yml \
#     up -d --build
#
# Services only (infra already up):
#   docker compose -f docker-compose.services.yml up -d --build
# ============================================================

services:
  # ============================================================
  # API Gateway — single entry point for all external requests
  # ============================================================
  api-gateway:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: services/api-gateway/build/libs/api-gateway-0.0.1-SNAPSHOT.jar
    container_name: api-gateway
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    ports: ["8080:8080"]
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: dev
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GATEWAY_CORS_ORIGINS: http://localhost:3000
    networks: [insurance-net]
    restart: unless-stopped
    depends_on:
      eureka-server: { condition: service_healthy }
      redis: { condition: service_healthy }

  customer-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.service
      args:
        JAR_PATH: services/customer-service/build/libs/customer-service-0.0.1-SNAPSHOT.jar
    container_name: customer-service
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    ports: ["8081:8080"]
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: dev
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://customer-db:5432/customer_db
      OUTBOX_POLL_INTERVAL_MS: "5000"
      OPENAPI_SERVER_URL: http://localhost:8081
    networks: [insurance-net]
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      customer-db: { condition: service_healthy }
      eureka-server: { condition: service_healthy }


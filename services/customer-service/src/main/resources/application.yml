server:
  port: 8081

spring:
  application:
    name: customer-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/customer_db
    username: ims_user
    password: ims_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    stream:
      default-binder: kafka
      dynamicDestinations: estimation.saga,customer.events
      bindings:
        processCustomerSaga-in-0:
          destination: estimation.saga
          group: customer-service-group
      kafka:
        bindings:
          processCustomerSaga-in-0:
            consumer:
              enableDlq: true
              dlqName: dlq.saga
              dlqProducerProperties:
                configuration:
                  key.serializer: org.apache.kafka.common.serialization.StringSerializer
                  value.serializer: org.springframework.kafka.support.serializer.JsonSerializer
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          defaultBrokerPort: 9092
          configuration:
            auto.create.topics.enable: false  # topics are pre-provisioned by kafka-init
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: customer-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.insurancemanagementsystem.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

customer:
  outbox:
    poll-interval-ms: 1000
    max-retries: 3
    failed-ttl-minutes: 60

outbox:
  poll-interval-ms: ${customer.outbox.poll-interval-ms:1000}
  max-retries: ${customer.outbox.max-retries:3}
  failed-ttl-minutes: ${customer.outbox.failed-ttl-minutes:60}

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{traceId:-},%X{spanId:-},%X{sagaId:-}] - %msg%n"
  level:
    com.insurancemanagementsystem: DEBUG

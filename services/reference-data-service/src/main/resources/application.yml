server:
  port: 8086

spring:
  application:
    name: reference-data-service
  profiles:
    active: dev
  config:
    import: classpath:application-common.yml
  datasource:
    url: jdbc:postgresql://localhost:5438/reference_data_db
    username: ims_user
    password: ims_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reference-data-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.insurancemanagementsystem.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cloud:
    stream:
      default-binder: kafka
      bindings:
        referenceDataEvents-out:
          destination: reference-data.events
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          configuration:
            auto.create.topics.enable: false  # topics are pre-provisioned by kafka-init

logging:
  level:
    com.insurancemanagementsystem: DEBUG

server:
  port: 8082

spring:
  application:
    name: vehicle-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5434/vehicle_db
    username: ims_user
    password: ims_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    stream:
      default-binder: kafka
      dynamicDestinations: estimation.saga
      bindings:
        processVehicleSaga-in-0:
          destination: estimation.saga
          group: vehicle-service-group
      kafka:
        default:
          consumer:
            # Error handling architecture:
            # - SAGA consumers (functional bindings): retry via binder-level retry config,
            #   then route to dlq.saga via enableDlq per binding
            # - DlqMonitor (@KafkaListener): uses dlqMonitorContainerFactory with
            #   no-retry handler to prevent infinite DLQ loops
            # - The KafkaErrorHandlerConfig CommonErrorHandler bean serves ONLY
            #   @KafkaListener containers (currently just DlqMonitor)
            retry:
              maxAttempts: 5
              backOff:
                initialInterval: 1000
                multiplier: 2.0
                maxInterval: 8000
        bindings:
          processVehicleSaga-in-0:
            consumer:
              enableDlq: true
              dlqName: dlq.saga
              dlqProducerProperties:
                configuration:
                  key.serializer: org.apache.kafka.common.serialization.StringSerializer
                  value.serializer: org.springframework.kafka.support.serializer.JsonSerializer
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          configuration:
            auto.create.topics.enable: false  # topics are pre-provisioned by kafka-init
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: vehicle-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.insurancemanagementsystem.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{traceId:-},%X{spanId:-},%X{sagaId:-}] - %msg%n"
  level:
    com.insurancemanagementsystem: DEBUG

vehicle:
  outbox:
    poll-interval-ms: 1000
    batch-size: 10
    max-retries: 3
    failed-ttl-minutes: 60

outbox:
  poll-interval-ms: ${vehicle.outbox.poll-interval-ms:1000}
  max-retries: ${vehicle.outbox.max-retries:3}
  failed-ttl-minutes: ${vehicle.outbox.failed-ttl-minutes:60}

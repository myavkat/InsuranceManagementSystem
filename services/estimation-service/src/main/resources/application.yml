server:
  port: 8085

spring:
  application:
    name: estimation-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5437/estimation_db
    username: ims_user
    password: ims_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    stream:
      default-binder: kafka
      dynamicDestinations: estimation.saga
      bindings:
        processEstimationSaga-in-0:
          destination: estimation.saga
          group: estimation-service-group
      kafka:
        bindings:
          processEstimationSaga-in-0:
            consumer:
              enableDlq: true
              dlqName: dlq.saga
              dlqProducerProperties:
                configuration:
                  key.serializer: org.apache.kafka.common.serialization.StringSerializer
                  value.serializer: org.springframework.kafka.support.serializer.JsonSerializer
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
          configuration:
            auto.create.topics.enable: false  # topics are pre-provisioned by kafka-init
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: estimation-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.insurancemanagementsystem.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{traceId:-},%X{spanId:-},%X{sagaId:-}] - %msg%n"
  level:
    com.insurancemanagementsystem: DEBUG

estimation:
  saga:
    timeout-minutes: 5
    poll-interval-ms: 30000
  outbox:
    poll-interval-ms: 1000
    batch-size: 10
    max-retries: 3
    failed-ttl-minutes: 60

outbox:
  poll-interval-ms: ${estimation.outbox.poll-interval-ms:1000}
  max-retries: ${estimation.outbox.max-retries:3}
  failed-ttl-minutes: ${estimation.outbox.failed-ttl-minutes:60}
